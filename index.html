    // ==================== TXT 试题解析 ====================
    function parseTxtQuestions(content) {
      const questions = [];
      // 按空行分割试题块
      const blocks = content.split(/\n\s*\n/).filter(b => b.trim());
      
      for (const block of blocks) {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 3) continue;
        
        // 解析题号 and 题目
        let qText = lines[0];
        let qType = 'single';
        
        // 检测多选题标记
        if (/[（(].*多选.*[)）]|\(多选\)|（多选）/i.test(qText)) {
          qType = 'multiple';
          qText = qText.replace(/[（(].*多选.*[)）]|\(多选\)|（多选）/gi, '');
        }
        
        // 移除题号 (如 "1. " 或 "1、")
        qText = qText.replace(/^\d+[\.、．\s]+/, '');
        
        // 解析选项
        const options = {};
        let answerLine = '';
        let explanation = '';
        let answer = '';
        
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          
          // 检测答案行
          if (/^答案[：:\s]+/i.test(line)) {
            answerLine = line;
            answer = line.replace(/^答案[：:\s]+/i, '').trim();
            continue;
          }
          
          // 检测解析行
          if (/^解析[：:\s]+/i.test(line)) {
            explanation = line.replace(/^解析[：:\s]+/i, '').trim();
            // 收集后续解析内容
            for (let j = i + 1; j < lines.length; j++) {
              if (/^答案[：:\s]+/i.test(lines[j])) break;
              explanation += '\n' + lines[j];
            }
            continue;
          }
          
          // 解析选项 A/B/C/D
          const optMatch = line.match(/^([A-Da-d])[\.、．\s]+(.+)$/);
          if (optMatch) {
            options[optMatch[1].toUpperCase()] = optMatch[2];
          }
        }
        
        // 如果没找到选项，可能是判断题
        if (Object.keys(options).length === 0) {
          // 检测判断题选项
          for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            if (/^A[\.、．\s]*正确|^A[\.、．\s]*对/i.test(line)) {
              options['A'] = '正确';
              options['B'] = '错误';
              qType = 'judge';
              break;
            }
            if (/^B[\.、．\s]*错误|^B[\.、．\s]*错/i.test(line)) {
              options['A'] = '正确';
              options['B'] = '错误';
              qType = 'judge';
              break;
            }
          }
        }
        
        // 必须有题目、选项和答案
        if (!qText || Object.keys(options).length < 2 || !answer) continue;
        
        questions.push({
          id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          type: qType,
          question: qText,
          options: options,
          answer: qType === 'multiple' ? answer.toUpperCase().split('') : answer.toUpperCase(),
          explanation: explanation
        });
      }
      
      return questions;
    }

    function autoParseQuestions(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
      const result = []; let current = null; let hasOptionsStarted = false;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const qMatch = line.match(/^(?:第\s*(\d+)\s*题|Question\s*(\d+)[.．]?|(\d+)[.．、)\]\s]+)(.+)/i);
        if (qMatch) { if (current && current.question && current.options.length >= 2) finalizeQuestion(current, result); current = { question: (qMatch[4] || line).trim(), options: [], answer: '', explanation: '', type: 'single' }; hasOptionsStarted = false; continue; }
        const optMatch = line.match(/^([A-Ha-h])[.．、)\]\s-–]+(.+)/);
        if (optMatch && current) { hasOptionsStarted = true; current.options.push(optMatch[2].trim()); continue; }
        const mulMatch = line.match(/(?:答案|正确?答案|答案[是为]|Answer|Key|Correct)\s*[:：=是为]?\s*([A-Ha-h]{2,}(?:[,，、][A-Ha-h])*)/i);
        if (mulMatch && current) { const raw = mulMatch[1].toUpperCase().replace(/[,，、]/g, ''); const uniq = [...new Set(raw.split('').filter(c => /[A-H]/.test(c)))].sort().join(''); if (uniq.length >= 2) { current.answer = uniq; current.type = 'multiple'; } continue; }
        const ansMatch = line.match(/(?:答案|正确?答案|答案[是为]|Answer|Key|Correct)\s*[:：=是为]?\s*([A-Ha-h])/i);
        if (ansMatch && current) { current.answer = ansMatch[1].toUpperCase(); continue; }
        const judgeMatch = line.match(/(?:答案|正确?答案|答案[是为])\s*[:：=是为]?\s*(正确|错误|对|错|[√×])/i);
        if (judgeMatch && current) { const v = judgeMatch[1]; current.answer = (v === '正确' || v === '对' || v === '√') ? 'A' : 'B'; current.type = 'judge'; continue; }
        const explMatch = line.match(/(?:解析|说明|解释|Explanation|Notes?)\s*[:：]\s*(.+)/i);
        if (explMatch && current) { current.explanation = explMatch[1].trim(); continue; }
        if (current && !hasOptionsStarted && line.length > 3) current.question += '\n' + line;
      }
      if (current && current.question && current.options.length >= 2) finalizeQuestion(current, result);
      return result;
    }

    function finalizeQuestion(q, arr) {
      const keys = ['A','B','C','D','E','F','G','H'];
      if (q.type === 'judge') { q.options = ['正确', '错误']; arr.push({ id: generateId(), type: q.type, question: q.question, options: q.options, answer: q.answer, explanation: q.explanation }); return; }
      if (!q.answer && q.options.length > 0) { const m = q.question.match(/[（(【\[<《]\s*([A-Ha-h])\s*[）)】\]>》]/); if (m) { q.answer = m[1].toUpperCase(); q.question = q.question.replace(/[（(【\[<《]\s*[A-Ha-h]\s*[）)】\]>》]/, ''); } }
      if (q.answer) {
        if (q.type === 'multiple') { const uniq = [...new Set(q.answer.split('').filter(c => /[A-H]/.test(c)))].sort().join(''); if (uniq.length >= 2) arr.push({ id: generateId(), type: q.type, question: q.question, options: q.options, answer: uniq, explanation: q.explanation }); }
        else { const idx = keys.indexOf(q.answer); if (idx >= 0 && idx < q.options.length) arr.push({ id: generateId(), type: q.type || 'single', question: q.question, options: q.options, answer: q.answer, explanation: q.explanation }); }
      }
    }
